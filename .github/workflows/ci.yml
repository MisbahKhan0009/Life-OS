name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Platform folders are generated here so the repo stays lean.
      # Existing files (lib/, test/, pubspec.yaml) are never overwritten.
      - name: Generate platform folders
        run: flutter create . --project-name life_os --org com.misbahkhan --platforms=android,web

      # Android lint's release check crashes inside a plugin (a lint bug, not app code),
      # so release lint is skipped. Dart analysis and tests still gate the build.
      - name: Skip Android release lint
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n' >> android/app/build.gradle.kts
          else
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> android/app/build.gradle
          fi

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: life-os-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: life-os-web
          path: build/web
