name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Platform folders are generated here so the repo stays lean.
      # Existing files (lib/, test/, pubspec.yaml) are never overwritten.
      - name: Generate platform folders
        run: flutter create . --project-name life_os --org com.misbahkhan --platforms=android,web

      # Our own platform files (app icon, splash, share target, manifest) go over the generated ones.
      - name: Apply Life OS platform files
        run: |
          cp -R platform/android/. android/
          cp -R platform/web/. web/

      # Android lint's release check crashes inside a plugin (a lint bug, not app code),
      # so release lint is skipped. Dart analysis and tests still gate the build.
      - name: Skip Android release lint
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n' >> android/app/build.gradle.kts
          else
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> android/app/build.gradle
          fi

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      # Release APKs are signed with the debug key. With the ANDROID_DEBUG_KEYSTORE secret
      # (a base64 debug.keystore) every build shares one signature, so new builds install
      # over old ones and keep your data. Without it each run makes a fresh key.
      - name: Use the stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Stable signing key in place"
          else
            echo "No ANDROID_DEBUG_KEYSTORE secret, using a fresh debug key"
          fi

      # One APK per chip type keeps each download small (about a third of a universal APK).
      - name: Build Android APKs
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk Life-OS-arm64.apk
          cp app-armeabi-v7a-release.apk Life-OS-armv7.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: life-os-android-apk
          path: |
            build/app/outputs/flutter-apk/Life-OS-arm64.apk
            build/app/outputs/flutter-apk/Life-OS-armv7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: life-os-web
          path: build/web

      # Every push to main becomes a release, so the latest APKs are always at
      # https://github.com/MisbahKhan0009/Life-OS/releases/latest
      - name: Publish release with the APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Life OS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/Life-OS-arm64.apk
            build/app/outputs/flutter-apk/Life-OS-armv7.apk
          body: |
            Android build for commit ${{ github.sha }}.
            Most phones from the last several years: download Life-OS-arm64.apk.
            Older or budget phones that refuse it: use Life-OS-armv7.apk.
            Open this page on your phone, download the APK and allow installs from your browser when asked.
            If Android says it conflicts with the installed app, uninstall the old build once first.
